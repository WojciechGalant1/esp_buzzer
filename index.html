<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buzzer ESP32</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
    }

    h1 {
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
      color: #fff;
    }

    .btn {
      border-radius: 12px;
      padding: 10px 20px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.03);
    }

    .btn-play { background-color: #22c55e; color: white; }
    .btn-busy { background-color: #f59e0b; color: white; }

    .song-list .list-group-item {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.12);
      cursor: pointer;
    }

    .song-list .list-group-item.active {
      background-color: #3b82f6;
      border-color: #3b82f6;
    }

    footer {
      margin-top: 20px;
      font-size: 0.85rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1><i class="bi bi-music-note-beamed text-warning"></i> Odtwarzacz buzzera</h1>

  <div id="status" class="mb-3">Stan: łączenie z Firebase…</div>

  <div class="card p-4 mb-3" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-2" style="font-size: 1.1rem;"><i class="bi bi-thermometer-half text-danger"></i> Temperatura</h3>
    <div id="tempValue" class="text-center" style="font-size: 2rem; font-weight: 600;">…</div>
  </div>

  <div class="card p-4" style="max-width: 400px; width: 100%;">
    <p class="text-center mb-3">Wybierz piosenkę i odtwórz ją na ESP32.</p>

    <div id="songList" class="list-group song-list mb-3"></div>

    <button id="playBtn" class="btn btn-play w-100" disabled>Łączenie...</button>
  </div>

  <footer></footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-hnLEABjATs9UVXxGDxqF9NWSEZHLUcU",
      authDomain: "alarmclock-7b2c2.firebaseapp.com",
      databaseURL: "https://alarmclock-7b2c2-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "alarmclock-7b2c2",
      storageBucket: "alarmclock-7b2c2.firebasestorage.app",
      messagingSenderId: "357543821921",
      appId: "1:357543821921:web:1daf6cdb309975ffa82020"
    };

    const songs = [
      "Prosta melodia",
      "Sto lat",
      "Gwiazdeczka",
      "Mario",
      "Jingle Bells"
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const playRef = ref(db, "board1/buzzer/play");
    const songRef = ref(db, "board1/buzzer/song");
    const tempRef = ref(db, "board1/sensors/temperature");

    const statusDiv = document.getElementById("status");
    const playBtn = document.getElementById("playBtn");
    const songList = document.getElementById("songList");
    const tempValue = document.getElementById("tempValue");

    let selectedSong = 0;
    let playing = false;
    let ready = false;

    songs.forEach((name, id) => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "list-group-item list-group-item-action";
      item.dataset.id = String(id);
      item.textContent = name;
      item.addEventListener("click", () => selectSong(id));
      songList.appendChild(item);
    });

    function songName(id) {
      return songs[id] || songs[0];
    }

    function showError(message) {
      statusDiv.textContent = "Błąd: " + message;
      playBtn.textContent = "Błąd połączenia";
      playBtn.disabled = true;
    }

    function updateSongUi(id) {
      selectedSong = id;
      songList.querySelectorAll(".list-group-item").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.id) === id);
      });
      if (ready && !playing) {
        statusDiv.textContent = "Stan: GOTOWY — " + songName(id);
      }
    }

    async function selectSong(id) {
      selectedSong = id;
      updateSongUi(id);
      try {
        await set(songRef, id);
      } catch (err) {
        showError(err.message);
      }
    }

    function setPlayingUi(isPlaying) {
      playing = isPlaying;
      if (!ready) {
        return;
      }
      if (isPlaying) {
        playBtn.textContent = "Odtwarzanie: " + songName(selectedSong);
        playBtn.className = "btn btn-busy w-100";
        playBtn.disabled = true;
        statusDiv.textContent = "Stan: ODTWARZANIE — " + songName(selectedSong);
      } else {
        playBtn.textContent = "Odtwórz melodię";
        playBtn.className = "btn btn-play w-100";
        playBtn.disabled = false;
        statusDiv.textContent = "Stan: GOTOWY — " + songName(selectedSong);
      }
    }

    try {
      await signInAnonymously(auth);
    } catch (err) {
      showError("logowanie Firebase: " + err.message + ". Włącz Anonymous Auth w Firebase Console.");
      throw err;
    }

    ready = true;
    updateSongUi(0);
    setPlayingUi(false);

    onValue(songRef, (snap) => {
      const id = Number(snap.val());
      if (!Number.isInteger(id) || id < 0 || id >= songs.length) {
        return;
      }
      updateSongUi(id);
    }, (err) => {
      showError(err.message);
    });

    onValue(playRef, (snap) => {
      setPlayingUi(!!snap.val());
    }, (err) => {
      showError(err.message);
    });

    onValue(tempRef, (snap) => {
      const t = snap.val();
      if (typeof t === "number" && Number.isFinite(t)) {
        tempValue.textContent = t.toFixed(1) + " °C";
      } else {
        tempValue.textContent = "brak odczytu";
      }
    }, (err) => {
      tempValue.textContent = "błąd";
      console.error(err);
    });

    playBtn.addEventListener("click", async () => {
      try {
        await set(songRef, selectedSong);
        await set(playRef, true);
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
